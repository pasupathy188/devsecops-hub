apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devsecops-ingress
spec:
  rules:
  - host: devsecops.local
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend-svc
            port:
              number: 3500
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-svc
            port:
              number: 80