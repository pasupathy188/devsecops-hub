name: Secrets Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Run gitleaks (CLI, no license required)
        run: |
          docker run --rm -v "$(pwd):/repo" zricethezav/gitleaks:latest detect \
            --source="/repo" \
            --verbose \
            --redact \
            --exit-code 1