name: DevSecOps Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Scan backend dependencies
        run: |
          cd backend
          npm audit --audit-level=high --json > ../backend-audit.json || true

      - name: Scan frontend dependencies
        run: |
          cd frontend
          npm audit --audit-level=high --json > ../frontend-audit.json || true

      - name: Run Semgrep
        run: |
          pip install semgrep --break-system-packages
          semgrep --config p/security-audit --json --output semgrep-results.json . || true

      - name: Install Python deps for reporting
        run: pip install requests --break-system-packages

      - name: Post code/dependency findings
        if: always()
        env:
          API_KEY: ${{ secrets.COMPLIANCE_API_KEY }}
        run: |
          python3 << 'EOF'
          import json, os, requests

          api_url = "https://devsecops-hub-8qlr.onrender.com/api/findings/bulk"
          headers = {"X-API-Key": os.environ["API_KEY"], "Content-Type": "application/json"}

          IGNORE_PACKAGES = {
              "@tootallnate/once", "http-proxy-agent", "jsdom",
              "jest-environment-jsdom", "jest-config", "@jest/core", "jest",
              "jest-cli", "jest-runner", "nth-check", "css-select", "svgo",
              "@svgr/plugin-svgo", "@svgr/webpack", "react-scripts", "postcss",
              "resolve-url-loader", "serialize-javascript",
              "css-minimizer-webpack-plugin", "rollup-plugin-terser",
              "workbox-build", "workbox-webpack-plugin", "underscore",
              "jsonpath", "bfj", "uuid", "sockjs", "webpack-dev-server",
              "nanoid", "fast-uri", "js-yaml", "brace-expansion"
          }

          for label, path in [("backend", "backend-audit.json"), ("frontend", "frontend-audit.json")]:
              try:
                  with open(path) as f:
                      data = json.load(f)
                  findings = []
                  for name, vuln in data.get("vulnerabilities", {}).items():
                      if name in IGNORE_PACKAGES:
                          continue
                      sev = vuln.get("severity", "").capitalize()
                      if sev not in ["Critical", "High"]:
                          continue
                      findings.append({
                          "description": f"{name} ({label}) - severity {vuln.get('severity')}",
                          "severity": sev
                      })
                  if findings:
                      r = requests.post(api_url, headers=headers, json={"source": "npm-audit", "findings": findings})
                      print(f"{label} npm audit: {r.status_code} - {r.text}")
                  else:
                      print(f"{label} npm audit: no actionable high/critical findings")
              except FileNotFoundError:
                  print(f"No audit file for {label}")
              except Exception as e:
                  print(f"Error processing {label} audit: {e}")

          try:
              with open("semgrep-results.json") as f:
                  data = json.load(f)
              findings = []
              for r in data.get("results", []):
                  sev_map = {"ERROR": "High", "WARNING": "Medium", "INFO": "Low"}
                  sev = sev_map.get(r.get("extra", {}).get("severity", "WARNING"), "Medium")
                  if sev != "High":
                      continue
                  findings.append({
                      "description": f"{r.get('check_id')} - {r.get('extra', {}).get('message', '')[:100]}",
                      "severity": sev,
                      "filePath": r.get("path")
                  })
              if findings:
                  resp = requests.post(api_url, headers=headers, json={"source": "semgrep", "findings": findings})
                  print(f"semgrep: {resp.status_code} - {resp.text}")
              else:
                  print("semgrep: no high-severity findings")
          except FileNotFoundError:
              print("No semgrep results file")
          except Exception as e:
              print(f"Error processing semgrep: {e}")
          EOF

      - name: Build Docker image
        working-directory: ./backend
        run: docker build --no-cache -t backend:latest .

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: 'backend:latest'
          format: 'json'
          output: 'trivy-output.json'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          trivyignores: 'backend/.trivyignore'

      - name: Generate SBOM
        if: always()
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: 'backend:latest'
          format: 'cyclonedx'
          output: 'sbom.json'

      - name: Post raw scan report
        if: always()
        env:
          API_KEY: ${{ secrets.COMPLIANCE_API_KEY }}
        run: |
          curl -X POST "https://devsecops-hub-8qlr.onrender.com/api/scans" \
            -H "Content-Type: application/json" \
            -H "X-API-Key: $API_KEY" \
            --data @trivy-output.json \
            --max-time 30 \
            --fail-with-body || echo "Failed to store raw scan (non-fatal)"

      - name: Fetch Settings & Send Smart Slack Alert
        if: always()
        env:
          API_KEY: ${{ secrets.COMPLIANCE_API_KEY }}
        run: |
          if [ ! -f "trivy-output.json" ]; then
            echo "⚠️ No trivy-output.json found. Skipping alert."
            exit 0
          fi

          echo "📡 Fetching alert thresholds from settings..."
          curl -s -H "X-API-Key: $API_KEY" "https://devsecops-hub-8qlr.onrender.com/api/settings" > settings.json

          CRITICAL_THRESHOLD=$(jq '.criticalThreshold // 0' settings.json)
          HIGH_THRESHOLD=$(jq '.highThreshold // 0' settings.json)
          SLACK_WEBHOOK=$(jq -r '.slackWebhookUrl // ""' settings.json)

          echo "⚙️  Critical Threshold: $CRITICAL_THRESHOLD"
          echo "⚙️  High Threshold: $HIGH_THRESHOLD"

          CRITICAL_COUNT=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' trivy-output.json)
          HIGH_COUNT=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity=="HIGH")] | length' trivy-output.json)

          echo "📊 Found Critical: $CRITICAL_COUNT, High: $HIGH_COUNT"

          if [ "$CRITICAL_COUNT" -gt "$CRITICAL_THRESHOLD" ] || [ "$HIGH_COUNT" -gt "$HIGH_THRESHOLD" ]; then
            if [ -n "$SLACK_WEBHOOK" ]; then
              echo "🚨 Thresholds exceeded! Sending Slack alert..."
              curl -X POST -H 'Content-type: application/json' --data "{\"text\":\"🚨 *COMPLIANCE ALERT!*\n• Critical: $CRITICAL_COUNT (threshold: $CRITICAL_THRESHOLD)\n• High: $HIGH_COUNT (threshold: $HIGH_THRESHOLD)\n• View: https://devsecops-hub.vercel.app\"}" "$SLACK_WEBHOOK"
              echo "✅ Slack alert sent."
            else
              echo "⚠️ No Slack webhook URL found in settings. Skipping."
            fi
          else
            echo "✅ All findings within thresholds. No alert needed."
          fi

      - name: Post findings to Compliance Hub API
        env:
          API_KEY: ${{ secrets.COMPLIANCE_API_KEY }}
        run: |
          cat > post_findings.py << 'EOF'
          import json
          import os
          import requests

          api_url = 'https://devsecops-hub-8qlr.onrender.com/api/findings'
          api_key = os.environ.get('API_KEY', '')

          try:
              with open('trivy-output.json', 'r') as f:
                  data = json.load(f)
          except FileNotFoundError:
              print('No trivy-output.json found.')
              exit(0)

          count = 0
          for result in data.get('Results', []):
              for vuln in result.get('Vulnerabilities', []):
                  severity = vuln.get('Severity', 'MEDIUM')
                  if severity not in ['CRITICAL', 'HIGH']:
                      continue
                  description = f"{vuln.get('VulnerabilityID')} - {vuln.get('Title', vuln.get('Description', ''))[:100]} (Package: {vuln.get('PkgName', 'Unknown')})"
                  payload = {
                      'description': description,
                      'severity': severity,
                      'status': 'Open',
                      'remediated': False
                  }
                  try:
                      response = requests.post(api_url, json=payload, headers={'X-API-Key': api_key})
                      if response.status_code in [200, 201]:
                          count += 1
                          print(f'Added: {description[:50]}...')
                  except Exception as e:
                      print(f'Error: {e}')
          print(f'Added {count} findings.')
          EOF

          python3 post_findings.py

      - name: Upload scan artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: trivy-reports
          path: |
            trivy-output.json
            sbom.json
          retention-days: 30