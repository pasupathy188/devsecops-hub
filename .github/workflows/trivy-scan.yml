name: Trivy Security Scan

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        working-directory: ./backend
        run: docker build -t backend:latest .

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'backend:latest'
          format: 'json'
          output: 'trivy-output.json'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Post raw scan report
        run: |
          curl -X POST "https://devsecops-hub-8qlr.onrender.com/api/scans" \
            -H "Content-Type: application/json" \
            --data @trivy-output.json \
            --max-time 30 \
            --fail-with-body || echo "Failed to store raw scan (non-fatal)"

      - name: Post individual findings
        run: |
          jq -c '
            [.Results[]?.Vulnerabilities[]? |
              select(.Severity == "CRITICAL" or .Severity == "HIGH") |
              {
                description: (.VulnerabilityID + " - " + .Title + " (Package: " + .PkgName + ")"),
                severity: (if .Severity == "CRITICAL" then "Critical" else "High" end),
                status: "Open",
                remediated: false
              }
            ][]' trivy-output.json | while read -r finding; do
              curl -s -X POST "https://devsecops-hub-8qlr.onrender.com/api/findings" \
                -H "Content-Type: application/json" \
                --data "$finding" \
                --max-time 15 \
                -o /dev/null -w "Status: %{http_code}\n" || true
            done

      - name: Upload scan artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report
          path: trivy-output.json
          retention-days: 30