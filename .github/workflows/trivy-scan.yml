name: DevSecOps Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Scan backend dependencies
        run: |
          cd backend
          npm audit --audit-level=high --json > ../backend-audit.json || true

      - name: Scan frontend dependencies
        run: |
          cd frontend
          npm audit --audit-level=high --json > ../frontend-audit.json || true

      - name: Run Semgrep
        run: |
          pip install semgrep --break-system-packages
          semgrep --config p/security-audit --json --output semgrep-results.json . || true

      - name: Install Python deps for reporting
        run: pip install requests --break-system-packages

      - name: Post code/dependency findings
        if: always()
        env:
          API_KEY: ${{ secrets.COMPLIANCE_API_KEY }}
        run: |
          python3 << 'EOF'
          import json, os, requests

          api_url = "https://devsecops-hub-8qlr.onrender.com/api/findings/bulk"
          headers = {"X-API-Key": os.environ["API_KEY"], "Content-Type": "application/json"}

          IGNORE_PACKAGES = {
              "@tootallnate/once", "http-proxy-agent", "jsdom",
              "jest-environment-jsdom", "jest-config", "@jest/core", "jest",
              "jest-cli", "jest-runner", "nth-check", "css-select", "svgo",
              "@svgr/plugin-svgo", "@svgr/webpack", "react-scripts", "postcss",
              "resolve-url-loader", "serialize-javascript",
              "css-minimizer-webpack-plugin", "rollup-plugin-terser",
              "workbox-build", "workbox-webpack-plugin", "underscore",
              "jsonpath", "bfj", "uuid", "sockjs", "webpack-dev-server",
              "nanoid", "fast-uri", "js-yaml", "brace-expansion"
          }

          for label, path in [("backend", "backend-audit.json"), ("frontend", "frontend-audit.json")]:
              try:
                  with open(path) as f:
                      data = json.load(f)
                  findings = []
                  for name, vuln in data.get("vulnerabilities", {}).items():
                      if name in IGNORE_PACKAGES:
                          continue
                      sev = vuln.get("severity", "").capitalize()
                      if sev not in ["Critical", "High"]:
                          continue
                      findings.append({
                          "description": f"{name} ({label}) - severity {vuln.get('severity')}",
                          "severity": sev
                      })
                  if findings:
                      r = requests.post(api_url, headers=headers, json={"source": "npm-audit", "findings": findings})
                      print(f"{label} npm audit: {r.status_code} - {r.text}")
                  else:
                      print(f"{label} npm audit: no actionable high/critical findings")
              except FileNotFoundError:
                  print(f"No audit file for {label}")
              except Exception as e:
                  print(f"Error processing {label} audit: {e}")

          try:
              with open("semgrep-results.json") as f:
                  data = json.load(f)
              findings = []
              for r in data.get("results", []):
                  sev_map = {"ERROR": "High", "WARNING": "Medium", "INFO": "Low"}
                  sev = sev_map.get(r.get("extra", {}).get("severity", "WARNING"), "Medium")
                  if sev != "High":
                      continue
                  findings.append({
                      "description": f"{r.get('check_id')} - {r.get('extra', {}).get('message', '')[:100]}",
                      "severity": sev,
                      "filePath": r.get("path")
                  })
              if findings:
                  resp = requests.post(api_url, headers=headers, json={"source": "semgrep", "findings": findings})
                  print(f"semgrep: {resp.status_code} - {resp.text}")
              else:
                  print("semgrep: no high-severity findings")
          except FileNotFoundError:
              print("No semgrep results file")
          except Exception as e:
              print(f"Error processing semgrep: {e}")
          EOF

      - name: Build Docker image
        working-directory: ./backend
        run: docker build --no-cache -t backend:latest .

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'backend:latest'
          format: 'json'
          output: 'trivy-output.json'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          trivyignores: 'backend/.trivyignore'

      - name: Generate SBOM
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'backend:latest'
          format: 'cyclonedx'
          output: 'sbom.json'

      - name: Post raw scan report
        if: always()
        env:
          API_KEY: ${{ secrets.COMPLIANCE_API_KEY }}
        run: |
          curl -X POST "https://devsecops-hub-8qlr.onrender.com/api/scans" \
            -H "Content-Type: application/json" \
            -H "X-API-Key: $API_KEY" \
            --data @trivy-output.json \
            --max-time 30 \
            --fail-with-body || echo "Failed to store raw scan (non-fatal)"

      - name: Upload scan artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trivy-reports
          path: |
            trivy-output.json
            sbom.json
          retention-days: 30