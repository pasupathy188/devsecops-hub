name: DevSecOps Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Scan backend dependencies
        run: |
          cd backend
          npm audit --audit-level=high || true

      - name: Scan frontend dependencies
        run: |
          cd frontend
          npm audit --audit-level=high || true

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: p/security-audit

      - name: Build Docker image
        working-directory: ./backend
        run: docker build -t backend:latest .

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'backend:latest'
          format: 'json'
          output: 'trivy-output.json'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Generate SBOM
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'backend:latest'
          format: 'cyclonedx'
          output: 'sbom.json'

      - name: Post raw scan report
        if: always()
        env:
          API_KEY: ${{ secrets.COMPLIANCE_API_KEY }}
        run: |
          curl -X POST "https://devsecops-hub-8qlr.onrender.com/api/scans" \
            -H "Content-Type: application/json" \
            -H "X-API-Key: $API_KEY" \
            --data @trivy-output.json \
            --max-time 30 \
            --fail-with-body || echo "Failed to store raw scan (non-fatal)"

      - name: Upload scan artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-reports
          path: |
            trivy-output.json
            sbom.json
          retention-days: 30
